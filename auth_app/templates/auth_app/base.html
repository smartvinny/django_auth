{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  {% if messages %}
    {% for message in messages %}
      <div class="message">
        {{message}}
      </div>
    {% endfor %}
  {% endif %}
  {% block body %}
  <h4>home</h4>   
  <form method="post" action="{% url 'auth_app:logout' %}">
  {% csrf_token %}
  <button type="submit">Logout</button>
</form>     
  {% endblock %}  
</body>
</html>
